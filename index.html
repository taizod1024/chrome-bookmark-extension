<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>chrome bookmark extension</title>
  <link rel="stylesheet" href="style.css">
  <script type="module" src="app.js"></script>
</head>
<body>
  <header class="toolbar">
    <div class="brand"><h1>bookmark</h1></div>
    <p id="summary" class="summary" aria-live="polite"></p>
    <label class="search"><span class="sr-only">Search bookmarks</span><input id="search" type="search" placeholder="Search by name, folder, or URL"></label>
    <div class="controls">
      <div class="column-control" role="group" aria-label="Column selection">
        <button id="columns-3" type="button" aria-pressed="false">3 cols</button>
        <button id="columns-6" type="button" aria-pressed="false">6 cols</button>
        <button id="columns-10" type="button" aria-pressed="false">10 cols</button>
      </div>
      <button id="edit-toggle" class="edit-toggle" type="button" aria-pressed="false">Edit</button>
    </div>
  </header>
  <main>
    <div id="status" class="status" role="status" aria-live="polite" hidden></div>
    <div id="panel-scrollbar" class="panel-scrollbar" role="region" aria-label="Horizontal panel scrolling" tabindex="0"><div id="panel-scrollbar-content"></div></div>
    <div id="panels" class="panels"></div>
    <p id="empty" class="empty" hidden></p>
  </main>
</body>
</html>
