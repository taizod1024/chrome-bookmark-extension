<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>chrome bookmark extension</title>
  <link rel="stylesheet" href="style.css">
  <script type="module" src="app.js"></script>
</head>
<body>
  <header class="toolbar">
    <div class="toolbar-left">
      <div class="brand"><h1>bookmark</h1></div>
      <p id="summary" class="summary" aria-live="polite"></p>
    </div>
    <div class="search-group" role="group" aria-label="Search options">
      <label class="search"><span class="sr-only">Search bookmarks</span><input id="search" type="search" autocomplete="off" placeholder="Search by name, folder, or URL"></label>
      <label class="flag"><input id="flag-keep-folders" type="checkbox"> Keep folders</label>
    </div>
    <div class="controls">
      <label class="flag"><input id="flag-equal-height" type="checkbox"> Equal height</label>
      <label class="flag"><input id="flag-single-row" type="checkbox"> 1 row</label>
      <select id="rows-select" class="select" aria-label="Bookmarks per panel">
        <option value="10">10 bookmarks</option>
        <option value="20">20 bookmarks</option>
        <option value="30">30 bookmarks</option>
        <option value="0">unset</option>
      </select>
      <select id="columns-select" class="select" aria-label="Column selection">
        <option value="3">3 cols</option>
        <option value="6">6 cols</option>
        <option value="10">10 cols</option>
      </select>
      <button id="edit-toggle" class="edit-toggle" type="button" aria-pressed="false">Edit</button>
    </div>
  </header>
  <main>
    <div id="status" class="status" role="status" aria-live="polite" hidden></div>
    <div id="panel-scrollbar" class="panel-scrollbar" role="region" aria-label="Horizontal panel scrolling" tabindex="0"><div id="panel-scrollbar-content"></div></div>
    <div id="panels" class="panels"></div>
    <p id="empty" class="empty" hidden></p>
  </main>
</body>
</html>
