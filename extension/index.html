<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>chrome bookmark extension</title>
  <link rel="stylesheet" href="style.css">
  <script type="module" src="app.js"></script>
</head>
<body>
  <header class="toolbar">
    <div class="toolbar-left">
      <div class="brand"><h1>bookmark</h1></div>
      <p id="summary" class="summary" aria-live="polite"></p>
    </div>
    <div class="search-group" role="group" aria-label="Search options">
      <label class="search">
        <span class="sr-only">Search bookmarks</span>
        <svg class="search-icon" aria-hidden="true" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M2 3h12l-4.5 5v4l-3 1.5V8L2 3Z"></path></svg>
        <input id="search" type="search" autocomplete="off" placeholder="Search by name, folder, or URL">
      </label>
    </div>
    <div class="controls">
      <details id="options-menu" class="options">
        <summary class="select">
          <svg class="options-icon" aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M10 3h4l.7 2.5 2 1.2 2.5-.6 2 3.5-1.8 1.9v2.4l1.8 1.9-2 3.5-2.5-.6-2 1.2L14 22h-4l-.7-2.5-2-1.2-2.5.6-2-3.5L4.6 13v-2.4L2.8 8.7l2-3.5 2.5.6 2-1.2L10 3Z"></path><circle cx="12" cy="12" r="3"></circle></svg>
          <span>Options</span>
        </summary>
        <div class="options-list" role="group" aria-label="Options">
          <label class="flag"><input id="flag-keep-folders" type="checkbox"><span>Keep folders</span></label>
          <label class="flag"><input id="flag-no-animation" type="checkbox"><span>No animation</span></label>
          <hr class="options-separator">
          <label class="flag"><input id="flag-no-height-adjustment" type="checkbox"><span>No height adjustment</span></label>
          <label class="flag"><input id="flag-no-wrap" type="checkbox"><span>No wrap</span></label>
          <label class="flag"><input id="flag-no-subfolder-stacking" type="checkbox"><span>No subfolder stacking</span></label>
        </div>
      </details>
      <select id="rows-select" class="select" aria-label="Bookmarks per panel">
        <option value="10">10 bookmarks</option>
        <option value="20">20 bookmarks</option>
        <option value="30">30 bookmarks</option>
        <option value="0">unset</option>
      </select>
      <select id="columns-select" class="select" aria-label="Column selection">
        <option value="3">3 cols</option>
        <option value="6">6 cols</option>
        <option value="10">10 cols</option>
      </select>
      <button id="edit-toggle" class="edit-toggle" type="button" aria-pressed="false">Edit</button>
    </div>
  </header>
  <main>
    <div id="status" class="status" role="status" aria-live="polite" hidden></div>
    <div id="panel-scrollbar" class="panel-scrollbar" role="region" aria-label="Horizontal panel scrolling" tabindex="0"><div id="panel-scrollbar-content"></div></div>
    <div id="panels" class="panels"></div>
    <p id="empty" class="empty" hidden></p>
  </main>
</body>
</html>
